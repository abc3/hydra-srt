services:
  hydra_srt:
    # Bridge networking with explicit port mappings for Docker environments
    # where Linux host networking is not available or not desired.
    ports:
      - "4000:4000"
      - "1935:1935"
      - "4100-4500:4100-4500/udp"
    environment:
      - VICTORIA_METRICS_URL=http://victoria-metrics:8428
      - VICTORIA_LOGS_URL=http://victoria-logs:9428
