name: Release Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dockerhub_publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Validate VERSION matches release tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "${RAW_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag format: '${RAW_TAG}' (expected vX.Y.Z)"
            exit 1
          fi
          TAG_VERSION="${RAW_TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "VERSION mismatch: VERSION file='${FILE_VERSION}', release tag='${RAW_TAG}' (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "VERSION check passed: ${FILE_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: streamband/hydra-srt
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
